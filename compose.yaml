services:
  app:
    build: .
    restart: unless-stopped
    ports:
      # 127.0.0.1 закрывает доступ из интернета (только твой ПК),
      # внешний порт 8080 отличается от внутреннего 8000
      - "127.0.0.1:8080:8000"
    environment:
      DB_PATH: /data/database.sqlite
    volumes:
      - app_data:/data

volumes:
  app_data: